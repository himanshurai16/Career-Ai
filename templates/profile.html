{% extends 'base.html' %}{% block title %}My profile · CareerAI{% endblock %}{% block content %}<section class="page-heading"><div class="eyebrow">YOUR FOUNDATION</div><h1>Student <span class="gradient-text">profile.</span></h1><p>Keep your details and skills current to improve recommendation relevance.</p></section><div class="form-card wide-card"><form method="post" class="form-grid"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label class="full">Full name *<input name="full_name" required minlength="2" maxlength="100" value="{{ profile.full_name }}"></label><label class="full">Email address<input value="{{ profile.email }}" disabled><small>Email cannot be changed here.</small></label><label>Education level<select name="education_level">{% for x in ['Undergraduate','Postgraduate','Diploma','Other'] %}<option {{ 'selected' if profile.education_level==x }}>{{ x }}</option>{% endfor %}</select></label><label>Degree & branch<input name="degree_branch" required maxlength="120" value="{{ profile.degree_branch }}"></label><label class="full">College name<input name="college_name" maxlength="160" value="{{ profile.college_name }}"></label><label>CGPA / percentage<input name="cgpa" value="{{ profile.cgpa }}" inputmode="decimal"></label><label>Graduation year<input name="graduation_year" type="number" min="2000" max="2100" value="{{ profile.graduation_year }}"></label><label class="full">Technical skills <small>Separate skills with commas</small><textarea name="skills" rows="3" maxlength="1000" placeholder="Python, SQL, HTML">{{ profile.skills }}</textarea></label><label class="full">Career interests<textarea name="interests" rows="2" maxlength="500" placeholder="What do you enjoy learning or building?">{{ profile.interests }}</textarea></label><label>Preferred domain<select name="preferred_domain">{% for x in ['Software Development','Web Development','Data Analytics','AI & Machine Learning','Cybersecurity','Cloud Computing'] %}<option {{ 'selected' if profile.preferred_domain==x }}>{{ x }}</option>{% endfor %}</select></label><label>Work mode<select name="work_mode">{% for x in ['Any','Remote','Hybrid','On-site'] %}<option {{ 'selected' if profile.work_mode==x }}>{{ x }}</option>{% endfor %}</select></label><div class="full"><button class="btn btn-primary" type="submit">Save profile changes ↗</button></div></form></div>{% endblock %}
